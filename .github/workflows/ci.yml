name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets are used anywhere in CI. Tests run against a disposable SQL Server
# container and an in-process SMTP capture server; MB-Dev and MB-Prod are never reachable.

jobs:
  website:
    name: Website (format, lint, typecheck, test, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mopboss.client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mopboss.client/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production launch guard refuses an incomplete production build
        run: |
          if NEXT_PUBLIC_DEPLOY_ENV=production npx next build > guard.log 2>&1; then
            echo "A production build without an API URL must fail"; exit 1
          fi
          grep -q "Refusing to build for production" guard.log
      - name: Vulnerability audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  browsers:
    name: Browsers (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mopboss.client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mopboss.client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build:e2e
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: mopboss.client/playwright-report
          retention-days: 7

  api:
    name: API (format, build, test with SQL Server, migrations, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.11
      - run: dotnet format MopBoss.Server/MopBoss.Server.csproj --verify-no-changes
      - run: dotnet format MopBoss.Server.Tests/MopBoss.Server.Tests.csproj --verify-no-changes
      - run: dotnet build MopBoss.Server.Tests --configuration Release
      - name: Tests (includes SQL Server 2022 in a disposable container)
        run: dotnet test MopBoss.Server.Tests --configuration Release --no-build
      - name: Model and migrations agree
        run: dotnet ef migrations has-pending-model-changes --project MopBoss.Server --configuration Release --no-build
      - name: Committed idempotent script is current
        run: |
          dotnet ef migrations script --idempotent --project MopBoss.Server --configuration Release --no-build -o /tmp/migrations.sql
          diff -u <(tr -d '\r' < database/MopBoss.migrations.idempotent.sql) <(tr -d '\r' < /tmp/migrations.sql)
      - name: Vulnerable packages
        run: |
          dotnet list MopBoss.Server package --vulnerable --include-transitive | tee vuln.txt
          dotnet list MopBoss.Server.Tests package --vulnerable --include-transitive | tee -a vuln.txt
          ! grep -qE "^\s+>" vuln.txt
